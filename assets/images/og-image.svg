<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Midnight Navy Background -->
  <rect width="1200" height="630" fill="#0E1724"/>
  
  <!-- Subtle Industrial Hairline Grid -->
  <line x1="80" y1="80" x2="1120" y2="80" stroke="#243548" stroke-width="1"/>
  <line x1="80" y1="550" x2="1120" y2="550" stroke="#243548" stroke-width="1"/>
  <line x1="80" y1="80" x2="80" y2="550" stroke="#243548" stroke-width="1"/>
  <line x1="1120" y1="80" x2="1120" y2="550" stroke="#243548" stroke-width="1"/>

  <!-- Brand Mark -->
  <g transform="translate(140, 190)">
    <rect width="90" height="90" fill="#C59B27"/>
    <text x="45" y="58" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="44" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">SNT</text>
    <text x="120" y="65" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="64" fill="#FFFFFF" letter-spacing="8">ENTERPRISES</text>
  </g>

  <!-- Antique Gold Accent Rule -->
  <rect x="140" y="320" width="100" height="4" fill="#C59B27"/>

  <!-- Subtitle -->
  <text x="140" y="380" font-family="'IBM Plex Sans', sans-serif" font-weight="500" font-size="28" fill="#EEF2F6" letter-spacing="1">INDUSTRIAL SCRAP TRADING &amp; MATERIAL SOURCING</text>
  
  <!-- Location / Tagline -->
  <text x="140" y="430" font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="18" fill="#E8CF7C" letter-spacing="2">MUMBAI, MAHARASHTRA, INDIA</text>
</svg>
